[workspace]
resolver = "2"
members = ["bucket-vault", "share-token"]

[workspace.dependencies]
soroban-sdk = "23"
# ponytail: pin below sdk's loose req; v3 pulls rand_core 0.10 which breaks
# soroban-env-host testutils (SigningKey::generate trait mismatch).
ed25519-dalek = "=2.2.0"

[profile.test]
debug = 0
incremental = false

[profile.release-with-logs]
inherits = "release"
debug = true
opt-level = "z"
overflow-checks = true

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = true
panic = "abort"
codegen-units = 1
